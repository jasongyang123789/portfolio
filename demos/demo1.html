// ============ 检索逻辑 ============
function tokenize(text) {
  const t = text.toLowerCase();
  const tokens = new Set();
  // 英文/数字词
  (t.match(/[a-z0-9]+/g) || []).forEach(w => { if (w.length > 1) tokens.add(w); });
  // 中文 2-gram + 3-gram
  const cn = t.replace(/[^\u4e00-\u9fa5]/g, ' ');
  cn.split(/\s+/).filter(Boolean).forEach(seg => {
    for (let i = 0; i < seg.length - 1; i++) tokens.add(seg.slice(i, i + 2));
    for (let i = 0; i < seg.length - 2; i++) tokens.add(seg.slice(i, i + 3));
  });
  return tokens;
}

function score(query, doc) {
  const qTok = tokenize(query);
  if (qTok.size === 0) return 0;
  let s = 0;
  const docText = (doc.title + ' ' + doc.content + ' ' + doc.keywords.join(' ') + ' ' + doc.cat).toLowerCase();
  // 关键词精确命中（权重高）
  for (const kw of doc.keywords) {
    if (query.toLowerCase().includes(kw.toLowerCase())) s += 12;
  }
  // token 重叠
  let hit = 0;
  for (const tk of qTok) {
    if (docText.includes(tk)) hit++;
  }
  s += (hit / Math.sqrt(qTok.size)) * 4;
  // 标题命中加分
  for (const tk of qTok) {
    if (doc.title.toLowerCase().includes(tk)) { s += 5; break; }
  }
  return s;
}

function retrieve(query, topK = 3) {
  const scored = KNOWLEDGE.map(d => ({ ...d, score: score(query, d) }))
    .filter(d => d.score > 6)
    .sort((a, b) => b.score - a.score);
  return scored.slice(0, topK);
}

function generateAnswer(query, docs) {
  if (docs.length === 0) {
    return `<h3>未找到直接相关材料</h3>
      <p>知识库中暂无与"${escapeHtml(query)}"直接匹配的片段。建议：<br>
      ① 换用更具体的关键词（如"德系""Chance""课题治理"）<br>
      ② 或明确问题范围（如"哪个战队的偏差最大"）</p>`;
  }

  const top = docs[0];
  let html = '';

  // 结论
  html += `<h3>结论</h3><p>${summarize(top)}</p>`;

  // 依据（多材料时展开）
  if (docs.length > 1) {
    html += `<h3>依据要点</h3><ul>`;
    for (const d of docs) {
      const key = extractKeyPoint(d);
      if (key) html += `<li><strong>${d.cat}</strong>：${key}</li>`;
    }
    html += `</ul>`;
  }

  // 数字提示
  const nums = docs.flatMap(d => d.numbers).filter((v, i, a) => a.indexOf(v) === i);
  if (nums.length) {
    html += `<h3>关键数据</h3><p>` + nums.map(n => `<span class="kpi-inline">${n}</span>`).join(' ') + `</p>`;
  }

  // 建议
  html += `<h3>可延伸追问</h3><p style="color:#718096;font-size:13px;">${followUps(top)}</p>`;

  return html;
}

function summarize(doc) {
  const c = doc.content;
  const sentences = c.split(/(?<=[。；])/).filter(s => s.length > 4);
  return sentences.slice(0, 2).join('');
}

function extractKeyPoint(doc) {
  const s = doc.content.split(/(?<=[。；])/).filter(x => x.length > 5);
  return s[0] || doc.content.slice(0, 60);
}

function followUps(doc) {
  const map = {
    '业务战队': '可以继续问：德系的偏差有多大？日系的 21.5 亿是怎么来的？自主 57% 转化率意味着什么？',
    '差距分析': '可以继续问：GAP 复盘的三层解释具体怎么落地？各战队的改进举措有哪些？',
    '风险管控': '可以继续问：高风险项目在预测里的处理规则是什么？四维竞争判断怎么打分？',
    '课题治理': '可以继续问：三层治理结构怎么和现有 KPI 衔接？激励机制怎么设计？',
    '预测管理': '可以继续问：14 个版本之间主要差异在哪？量纲不统一怎么解决？',
    '公司战略': '可以继续问：50 项重点工作怎么分解到部门？四级规划体系怎么协同？'
  };
  return map[doc.cat] || '可以针对具体战队、产品线或职能模块继续追问。';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ============ UI 交互 ============
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const welcomeEl = document.getElementById('welcome');

// 渲染材料库列表
const docListEl = document.getElementById('docList');
const dotMap = { strategy:'dot-strategy', biz:'dot-biz', func:'dot-func', topic:'dot-topic' };
const groupMap = { strategy:'公司战略层', biz:'业务与产品层', func:'职能与制度层', topic:'专题与管控' };
for (const g of ['strategy','biz','func','topic']) {
  const h = document.createElement('div');
  h.className = 'doc-list-title';
  h.textContent = groupMap[g];
  docListEl.appendChild(h);
  KNOWLEDGE.filter(d => d.category === g).forEach(d => {
    const div = document.createElement('div');
    div.className = 'doc-item';
    div.innerHTML = `<span class="doc-dot ${dotMap[g]}"></span><span>${d.title}</span>`;
    docListEl.appendChild(div);
  });
}

// 渲染推荐问题
const sugEl = document.getElementById('suggests');
SUGGEST_QUESTIONS.forEach(s => {
  const btn = document.createElement('button');
  btn.className = 'suggest';
  btn.innerHTML = `<span class="suggest-tag">${s.tag}</span>${s.q}`;
  btn.onclick = () => { inputEl.value = s.q; ask(); };
  sugEl.appendChild(btn);
});

function addUserMsg(text) {
  const d = document.createElement('div');
  d.className = 'msg msg-user';
  d.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
  chatEl.appendChild(d);
}

function addAiMsg(html, docs) {
  const d = document.createElement('div');
  d.className = 'msg msg-ai';
  let sourcesHtml = '';
  if (docs.length) {
    sourcesHtml = `<div class="sources"><div class="sources-label">引用来源（${docs.length} 个片段）</div>`;
    docs.forEach(doc => {
      sourcesHtml += `<div class="source-card">
        <div class="src-title"><span>${doc.id} · ${doc.title}</span><span class="src-score">相关度 ${doc.score.toFixed(1)}</span></div>
        ${doc.content.slice(0, 110)}…
      </div>`;
    });
    sourcesHtml += `</div>`;
  }
  d.innerHTML = `<div class="avatar">AI</div><div class="ai-body"><div class="answer">${html}</div>${sourcesHtml}</div>`;
  chatEl.appendChild(d);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function addTyping() {
  const d = document.createElement('div');
  d.className = 'msg msg-ai';
  d.id = 'typing';
  d.innerHTML = `<div class="avatar">AI</div><div class="ai-body"><div class="answer"><div class="typing"><span></span><span></span><span></span></div></div></div>`;
  chatEl.appendChild(d);
  chatEl.scrollTop = chatEl.scrollHeight;
}

let busy = false;
function ask() {
  const q = inputEl.value.trim();
  if (!q || busy) return;
  busy = true;
  sendBtn.disabled = true;

  if (welcomeEl) { welcomeEl.remove(); }

  addUserMsg(q);
  inputEl.value = '';
  inputEl.style.height = 'auto';

  addTyping();

  setTimeout(() => {
    const t = document.getElementById('typing');
    if (t) t.remove();
    const docs = retrieve(q, 3);
    addAiMsg(generateAnswer(q, docs), docs);
    busy = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }, 620);
}

sendBtn.onclick = ask;
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
});
inputEl.focus();
</script>
